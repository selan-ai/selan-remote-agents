<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="600" fill="#0f172a">A fleet of Selan remote agents</text>
  <text x="30" y="62" font-size="13" fill="#64748b">Something wakes every agent. Workers hand work on. One supervisor manages agents. A few may ask a person, only for hands.</text>

  <!-- Triggers -->
  <text x="30" y="112" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">WAKES THEM</text>
  <rect x="30" y="124" width="160" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="46" y="146" font-size="14" font-weight="600" fill="#0f172a">Schedule</text>
  <text x="46" y="164" font-size="12" fill="#475569">cron, off :00 and :30</text>
  <rect x="30" y="192" width="160" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="46" y="214" font-size="14" font-weight="600" fill="#0f172a">Event</text>
  <text x="46" y="232" font-size="12" fill="#475569">webhook + a sentence</text>
  <rect x="30" y="260" width="160" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="46" y="282" font-size="14" font-weight="600" fill="#0f172a">Another agent</text>
  <text x="46" y="300" font-size="12" fill="#475569">its callers list</text>
  <line x1="190" y1="150" x2="238" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="218" x2="238" y2="262" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="286" x2="238" y2="274" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Workspace rules -->
  <rect x="240" y="84" width="450" height="30" rx="6" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="465" y="104" font-size="13" text-anchor="middle" fill="#3730a3">Workspace rules: every run reads them first</text>

  <!-- Supervisor -->
  <rect x="365" y="128" width="200" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="465" y="150" font-size="14" font-weight="600" text-anchor="middle" fill="#1e3a8a">Supervisor</text>
  <text x="465" y="168" font-size="12" text-anchor="middle" fill="#1e40af">manages agents, never code</text>
  <line x1="430" y1="178" x2="430" y2="206" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
  <text x="424" y="198" font-size="11" text-anchor="end" fill="#1e40af">missions</text>
  <line x1="500" y1="206" x2="500" y2="180" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
  <text x="506" y="198" font-size="11" fill="#1e40af">every ending is read</text>

  <!-- Workers -->
  <rect x="240" y="208" width="450" height="184" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="256" y="230" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">WORKERS · ONE JOB EACH</text>
  <rect x="256" y="244" width="130" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="321" y="269" font-size="13" text-anchor="middle" fill="#0f172a">Deploy</text>
  <rect x="400" y="244" width="130" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="465" y="269" font-size="13" text-anchor="middle" fill="#0f172a">Log watcher</text>
  <rect x="544" y="244" width="130" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="609" y="269" font-size="13" text-anchor="middle" fill="#0f172a">Error tracker</text>
  <rect x="256" y="298" width="130" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="321" y="323" font-size="13" text-anchor="middle" fill="#0f172a">Cleanup</text>
  <rect x="400" y="298" width="130" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="465" y="323" font-size="13" text-anchor="middle" fill="#0f172a">Security</text>
  <rect x="544" y="298" width="130" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="609" y="323" font-size="13" text-anchor="middle" fill="#0f172a">Dependencies</text>
  <text x="465" y="372" font-size="12" text-anchor="middle" fill="#64748b">memory is a ledger · every run ends ok, warn or error</text>

  <!-- Coder and shipping -->
  <rect x="760" y="208" width="200" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="860" y="232" font-size="14" font-weight="600" text-anchor="middle" fill="#065f46">Coder</text>
  <text x="860" y="250" font-size="12" text-anchor="middle" fill="#047857">writes every handed-off fix</text>
  <line x1="690" y1="262" x2="756" y2="238" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="722" y="238" font-size="11" text-anchor="middle" fill="#475569">hand off</text>

  <rect x="760" y="292" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="860" y="315" font-size="13" text-anchor="middle" fill="#0f172a">MR · pipeline · review</text>
  <text x="860" y="334" font-size="13" text-anchor="middle" fill="#0f172a">merge · deploy · verify</text>
  <line x1="860" y1="264" x2="860" y2="288" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="760" y="376" width="200" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="860" y="401" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Production</text>
  <line x1="860" y1="348" x2="860" y2="372" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M760,396 C720,396 700,380 692,372" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="700" y="418" font-size="11" fill="#475569">verified next run</text>

  <!-- Questions -->
  <rect x="240" y="470" width="450" height="80" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="465" y="496" font-size="14" font-weight="600" text-anchor="middle" fill="#78350f">agent-question board</text>
  <text x="465" y="516" font-size="12" text-anchor="middle" fill="#92400e">one issue per ask · label agent: &lt;name&gt; · run: and fingerprint lines</text>
  <text x="465" y="534" font-size="12" text-anchor="middle" fill="#92400e">only hands: a credential, a sign-in, an access</text>
  <path d="M960,236 H984 V510 H694" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="600" y1="392" x2="600" y2="466" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="608" y="436" font-size="11" fill="#92400e">a few agents ask</text>
  <line x1="330" y1="470" x2="330" y2="396" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
  <text x="338" y="436" font-size="11" fill="#92400e">a reply wakes the agent that asked</text>

  <rect x="30" y="484" width="160" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="46" y="506" font-size="14" font-weight="600" fill="#0f172a">A person</text>
  <text x="46" y="524" font-size="12" fill="#475569">answers in a comment</text>
  <line x1="190" y1="510" x2="236" y2="510" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
